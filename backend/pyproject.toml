[project]
name = "private-tasks"
version = "0.0.0"
description = "Self-hosted, single-user task manager and calendar."
license = "MIT"
requires-python = ">=3.15"
dependencies = [
    "fastapi>=0.163.1",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"
module-root = ""

[tool.ruff]
line-length = 100
target-version = "py315"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # import sorting
    "N",   # naming
    "UP",  # modern Python syntax
    "B",   # likely bugs
    "SIM", # simplifications
    "S",   # security
    "PTH", # pathlib
    "RUF", # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"] # assert is how pytest checks things

[tool.mypy]
strict = true
python_version = "3.15"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config"]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
